name: Build RingRTC iOS Artifacts
run-name: Build RingRTC iOS Artifacts (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "When true, don't upload to GCS"
        default: false
        required: false
        type: boolean
      runner:
        description: "Mac runner:"
        default: 'macos-15'
        required: true
        type: string

  workflow_call:
    inputs:
      dry_run:
        description: "When true, don't upload to GCS"
        default: true
        required: true
        type: boolean
      runner:
        description: "Mac runner:"
        default: 'macos-15'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build_ios:
    name: Build iOS

    permissions:
      # Needed to clone the repo
      contents: 'read'
      # Needed for google-github-actions/auth.
      id-token: 'write'

    runs-on: ${{ inputs.runner }}

    steps:
    - uses: actions/checkout@v6
    - run: brew install coreutils # for grealpath
    - uses: ./.github/actions/setup-rust
      with:
        targets: x86_64-apple-ios,aarch64-apple-ios,aarch64-apple-ios-sim
        components: rust-src
        tools: cbindgen
        cache: false
    - run: sudo xcodes select 26.1.1
    - run: ./bin/build-ios --ringrtc-only --archive-ringrtc --release
    - name: Output Artifact Checksum
      run: 'sha256sum out/ringrtc-ios-build-v*.xcframework.zip | tee -a $GITHUB_STEP_SUMMARY'

    - name: Upload iOS Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ringrtc-ios
        path: out/ringrtc-ios-build-v*.xcframework.zip
        retention-days: 2

    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: 'projects/741367068918/locations/global/workloadIdentityPools/github/providers/github-actions'
        service_account: 'github-actions@signal-build-artifacts.iam.gserviceaccount.com'

    - uses: google-github-actions/upload-cloud-storage@v3
      if: ${{ !inputs.dry_run }}
      with:
        path: 'out'
        destination: build-artifacts.signal.org/libraries
        glob: 'ringrtc-ios-build-v*.xcframework.zip'
        parent: false
        process_gcloudignore: false
