name: Build WebRTC Artifacts
run-name: Build WebRTC Artifacts (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "When true, don't upload to GCS"
        default: false
        required: false
        type: boolean

permissions:
  # Needed to clone the repo
  contents: 'read'
  # Needed for google-github-actions/auth.
  id-token: 'write'

jobs:
  build_android:
    name: Build Android

    runs-on: 'ubuntu-24.04-8-cores'

    outputs:
      checksum: ${{ steps.checksum.outputs.checksum }}

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Git Cookies
        uses: ./.github/actions/setup-gitcookies
        with:
          cookie-content: ${{ secrets.WEBRTC_GIT_COOKIES }}

      - run: ./bin/build-webrtc.py --target android --release

      - name: Output Artifact Checksum
        id: checksum
        run: |
          sha256sum out/webrtc-*.tar.bz2 | tee -a $GITHUB_STEP_SUMMARY
          echo "checksum=$(sha256sum out/webrtc-*.tar.bz2 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/741367068918/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'github-actions@signal-build-artifacts.iam.gserviceaccount.com'

      - uses: google-github-actions/upload-cloud-storage@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: 'out'
          destination: build-artifacts.signal.org/libraries
          glob: 'webrtc-*.tar.bz2'
          parent: false
          process_gcloudignore: false

  build_ios:
    name: Build iOS

    runs-on: 'macos-15-xlarge'

    outputs:
      checksum: ${{ steps.checksum.outputs.checksum }}

    steps:
      - uses: actions/checkout@v6

      - run: brew install protobuf

      # Installs the pkg_resources python module needed to build webrtc on a mac host
      - run: pip install setuptools

      - name: Setup Git Cookies
        uses: ./.github/actions/setup-gitcookies
        with:
          cookie-content: ${{ secrets.WEBRTC_GIT_COOKIES }}

      - run: ./bin/build-webrtc.py --target ios --release

      - name: Output Artifact Checksum
        id: checksum
        run: |
          sha256sum out/webrtc-*.tar.bz2 | tee -a $GITHUB_STEP_SUMMARY
          echo "checksum=$(sha256sum out/webrtc-*.tar.bz2 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/741367068918/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'github-actions@signal-build-artifacts.iam.gserviceaccount.com'

      - uses: google-github-actions/upload-cloud-storage@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: 'out'
          destination: build-artifacts.signal.org/libraries
          glob: 'webrtc-*.tar.bz2'
          parent: false
          process_gcloudignore: false

  build_linux:
    name: Build Linux

    runs-on: 'ubuntu-24.04-4-cores'

    outputs:
      checksum_x64: ${{ steps.checksum.outputs.checksum_x64 }}
      checksum_arm64: ${{ steps.checksum.outputs.checksum_arm64 }}

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler crossbuild-essential-arm64

      - name: Setup Git Cookies
        uses: ./.github/actions/setup-gitcookies
        with:
          cookie-content: ${{ secrets.WEBRTC_GIT_COOKIES }}

      - run: ./bin/build-webrtc.py --target linux --release

      - name: Output Artifact Checksum
        id: checksum
        run: |
          sha256sum out/webrtc-*.tar.bz2 | tee -a $GITHUB_STEP_SUMMARY
          sha256sum out_arm/webrtc-*.tar.bz2 | tee -a $GITHUB_STEP_SUMMARY
          echo "checksum_x64=$(sha256sum out/webrtc-*.tar.bz2 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "checksum_arm64=$(sha256sum out_arm/webrtc-*.tar.bz2 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/741367068918/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'github-actions@signal-build-artifacts.iam.gserviceaccount.com'

      - uses: google-github-actions/upload-cloud-storage@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: 'out'
          destination: build-artifacts.signal.org/libraries
          glob: 'webrtc-*.tar.bz2'
          parent: false
          process_gcloudignore: false

      - uses: google-github-actions/upload-cloud-storage@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: 'out_arm'
          destination: build-artifacts.signal.org/libraries
          glob: 'webrtc-*.tar.bz2'
          parent: false
          process_gcloudignore: false

  build_mac:
    name: Build Mac

    runs-on: 'macos-15-xlarge'

    outputs:
      checksum_x64: ${{ steps.checksum.outputs.checksum_x64 }}
      checksum_arm64: ${{ steps.checksum.outputs.checksum_arm64 }}

    steps:
      - uses: actions/checkout@v6

      - run: brew install protobuf

      # Installs the pkg_resources python module needed to build webrtc on a mac host
      - run: pip install setuptools

      - name: Setup Git Cookies
        uses: ./.github/actions/setup-gitcookies
        with:
          cookie-content: ${{ secrets.WEBRTC_GIT_COOKIES }}

      - run: ./bin/build-webrtc.py --target mac --release

      - name: Output Artifact Checksum
        id: checksum
        run: |
          sha256sum out/webrtc-*.tar.bz2 | tee -a $GITHUB_STEP_SUMMARY
          sha256sum out_arm/webrtc-*.tar.bz2 | tee -a $GITHUB_STEP_SUMMARY
          echo "checksum_x64=$(sha256sum out/webrtc-*.tar.bz2 | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "checksum_arm64=$(sha256sum out_arm/webrtc-*.tar.bz2 | awk '{print $1}')" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/741367068918/locations/global/workloadIdentityPools/github/providers/github-actions'
          service_account: 'github-actions@signal-build-artifacts.iam.gserviceaccount.com'

      - uses: google-github-actions/upload-cloud-storage@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: 'out'
          destination: build-artifacts.signal.org/libraries
          glob: 'webrtc-*.tar.bz2'
          parent: false
          process_gcloudignore: false

      - uses: google-github-actions/upload-cloud-storage@v3
        if: ${{ !inputs.dry_run }}
        with:
          path: 'out_arm'
          destination: build-artifacts.signal.org/libraries
          glob: 'webrtc-*.tar.bz2'
          parent: false
          process_gcloudignore: false

  build_windows:
    name: Build Windows

    runs-on: 'windows-2025-8-cores'

    outputs:
      checksum_x64: ${{ steps.checksum.outputs.checksum_x64 }}
      checksum_arm64: ${{ steps.checksum.outputs.checksum_arm64 }}

    steps:
    - name: Setup git to use linux line endings and keep permissions
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        git config --global core.filemode false

    - uses: actions/checkout@v6

    - name: Install Windows SDK
      uses: ChristopheLav/windows-sdk-install@v1
      with:
        version-sdk: 28000
        features: 'OptionId.UWPCPP,OptionId.DesktopCPPx64,OptionId.DesktopCPParm64,OptionId.WindowsDesktopDebuggers'

    - name: Setup Git Cookies
      uses: ./.github/actions/setup-gitcookies
      with:
        cookie-content: ${{ secrets.WEBRTC_GIT_COOKIES }}

    - run: python bin/build-webrtc.py --target windows --release
      shell: bash

    - name: Output Artifact Checksum
      id: checksum
      run: |
        sha256sum out/webrtc-*.tar.bz2 | tee -a $GITHUB_STEP_SUMMARY
        sha256sum out_arm/webrtc-*.tar.bz2 | tee -a $GITHUB_STEP_SUMMARY
        echo "checksum_x64=$(sha256sum out/webrtc-*.tar.bz2 | awk '{print $1}')" >> $GITHUB_OUTPUT
        echo "checksum_arm64=$(sha256sum out_arm/webrtc-*.tar.bz2 | awk '{print $1}')" >> $GITHUB_OUTPUT
      shell: bash

    - uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: 'projects/741367068918/locations/global/workloadIdentityPools/github/providers/github-actions'
        service_account: 'github-actions@signal-build-artifacts.iam.gserviceaccount.com'

    - uses: google-github-actions/upload-cloud-storage@v3
      if: ${{ !inputs.dry_run }}
      with:
        path: 'out'
        destination: build-artifacts.signal.org/libraries
        glob: 'webrtc-*.tar.bz2'
        parent: false
        process_gcloudignore: false

    - uses: google-github-actions/upload-cloud-storage@v3
      if: ${{ !inputs.dry_run }}
      with:
        path: 'out_arm'
        destination: build-artifacts.signal.org/libraries
        glob: 'webrtc-*.tar.bz2'
        parent: false
        process_gcloudignore: false

  output_checksums_json:
    name: Output Checksums JSON

    runs-on: ubuntu-latest

    needs: [build_android, build_ios, build_linux, build_mac, build_windows]

    steps:
      - name: Output Combined JSON
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## Combined `webrtc_artifact_checksums.json`
          ```json
          {
            "android": "${{ needs.build_android.outputs.checksum }}",
            "ios": "${{ needs.build_ios.outputs.checksum }}",
            "linux-x64": "${{ needs.build_linux.outputs.checksum_x64 }}",
            "linux-arm64": "${{ needs.build_linux.outputs.checksum_arm64 }}",
            "mac-x64": "${{ needs.build_mac.outputs.checksum_x64 }}",
            "mac-arm64": "${{ needs.build_mac.outputs.checksum_arm64 }}",
            "windows-x64": "${{ needs.build_windows.outputs.checksum_x64 }}",
            "windows-arm64": "${{ needs.build_windows.outputs.checksum_arm64 }}"
          }
          ```
          EOF
