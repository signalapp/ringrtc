[workspace]
resolver = "2"
members = [
  "call_sim",
  "mrp",
  "protobuf",
  "src/rust",
  "webrtc-sys",
  "webrtc-sys/build",
]

# prevents building webrtc-sys changes by default
default-members = [
  "call_sim",
  "mrp",
  "protobuf",
  "src/rust",
]

[workspace.lints.clippy]
unnecessary_wraps = "warn"

[workspace.package]
version = "2.75.0"
authors = ["Calling Team <callingteam@signal.org>"]
